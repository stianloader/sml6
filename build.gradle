plugins {
    id 'java'
    id 'java-library'
    id 'maven-publish'
    id 'java-gradle-plugin'
}

project.group = 'org.stianloader'
base {
    archivesName = 'sml6'
}
project.version = '0.3.0'

java.targetCompatibility = compileJava.targetCompatibility = '17'
java.sourceCompatibility = compileJava.sourceCompatibility = '17'

repositories {
    mavenLocal()
    maven {
        name = 'stianloader-maven'
        url = 'https://stianloader.org/maven/'
    }
    mavenCentral()
}

dependencies {
    // https://mvnrepository.com/artifact/de.geolykt.starloader/reversible-access-setter
    implementation 'de.geolykt.starloader:reversible-access-setter:1.1.0'

    implementation gradleApi()
    implementation 'org.ow2.asm:asm:9.10.1'
    implementation 'org.ow2.asm:asm-tree:9.10.1'
    implementation 'org.ow2.asm:asm-util:9.10.1'
    implementation 'org.ow2.asm:asm-commons:9.10.1'

    // https://mvnrepository.com/artifact/org.json/json
    implementation 'org.json:json:20260814'

    // https://mvnrepository.com/artifact/org.vineflower/vineflower
    implementation 'org.vineflower:vineflower:1.12.0'

    // https://mvnrepository.com/artifact/net.fabricmc/mapping-io
    implementation 'net.fabricmc:mapping-io:0.9.1'

    // https://mvnrepository.com/artifact/org.jetbrains/annotations
    compileOnly 'org.jetbrains:annotations:26.1.0'

    // https://mvnrepository.com/artifact/org.tukaani/xz
    implementation 'org.tukaani:xz:1.12'
    // https://mvnrepository.com/artifact/org.glavo.kala/kala-compress-archivers-tar
    implementation 'org.glavo.kala:kala-compress-archivers-tar:1.27.1-3'

    implementation 'org.stianloader:stianloader-remapper:0.3.0-a20260326'
    implementation 'org.stianloader:stianloader-deobf:0.3.0-a20260314'
    implementation 'org.stianloader:micromixin-remapper:0.2.2-a20251218'
    implementation 'org.stianloader:picoresolve:1.1.3-a20260618.1'

    // Source: https://mvnrepository.com/artifact/software.coley/lljzip
    // This is the last version that supports J17; newer versions depend on Java's FFI/FFM API and are as such
    // not an option for us given that Gradle 9 depends on J17+, meaning that the version ceiling is J17 for us.
    // However, with Gradle 10 we might want to look into upgrading that dependency since I'd expect
    // Gradle 10 to raise the Java version floor to a version newer version of lljzip.
    implementation 'software.coley:lljzip:1.6.1'

    // Source: https://mvnrepository.com/artifact/software.coley/cafedude-core
    implementation 'software.coley:cafedude-core:2.6.6'
}

gradlePlugin {
    plugins {
        gslStarplanePlugin {
            id = base.archivesName.get()
            version = project.version
            implementationClass = 'org.stianloader.sml6.SML6GradlePlugin'
        }
    }
}

task sourcesJar(type: Jar, dependsOn: classes) {
    archiveClassifier = 'sources'
    from sourceSets.main.allSource
}

publishing {
    publications {
        /*mavenJava(MavenPublication) {
            groupId = project.group
            artifactId = base.archivesName.get()
            version = project.version

            from components['java']

            artifact sourcesJar
        }*/
    }

    repositories {
        if (System.getProperty('publishRepo') != null) {
            maven {
                url System.getProperty('publishRepo')
                allowInsecureProtocol = true
            }
        } else {
            mavenLocal()
        }
    }
}
