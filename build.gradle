plugins {
    id 'java'
    id 'java-library'
    id 'maven-publish'
    id 'java-gradle-plugin'
}

project.group = 'org.stianloader'
base {
    archivesName = 'sml6'
}
project.version = '0.1.0'

java.targetCompatibility = compileJava.targetCompatibility = '17'
java.sourceCompatibility = compileJava.sourceCompatibility = '17'

repositories {
    mavenLocal()
    maven {
        name = 'stianloader-maven'
        url = 'https://stianloader.org/maven/'
    }
    mavenCentral()
}

dependencies {
    // https://mvnrepository.com/artifact/de.geolykt.starloader/reversible-access-setter
    implementation "de.geolykt.starloader:reversible-access-setter:1.1.0"

    implementation gradleApi()
    implementation "org.ow2.asm:asm:9.9.1"
    implementation "org.ow2.asm:asm-tree:9.9.1"
    implementation "org.ow2.asm:asm-util:9.9.1"
    implementation "org.ow2.asm:asm-commons:9.9.1"

    // https://mvnrepository.com/artifact/org.json/json
    implementation 'org.json:json:20251224'

    // https://mvnrepository.com/artifact/org.vineflower/vineflower
    implementation 'org.vineflower:vineflower:1.11.2'

    // https://mvnrepository.com/artifact/net.fabricmc/mapping-io
    implementation 'net.fabricmc:mapping-io:0.8.0'

    // https://mvnrepository.com/artifact/org.jetbrains/annotations
    compileOnly "org.jetbrains:annotations:26.0.2-1"

    // https://mvnrepository.com/artifact/org.tukaani/xz
    implementation 'org.tukaani:xz:1.12'
    // https://mvnrepository.com/artifact/org.glavo.kala/kala-compress-archivers-tar
    implementation 'org.glavo.kala:kala-compress-archivers-tar:1.27.1-1'

    implementation 'org.stianloader:stianloader-remapper:0.3.0-a20260326'
    implementation 'org.stianloader:stianloader-deobf:0.3.0-a20260314'
    implementation 'org.stianloader:micromixin-remapper:0.2.2-a20251218'
}

gradlePlugin {
    plugins {
        gslStarplanePlugin {
            id = base.archivesName.get()
            version = project.version
            implementationClass = 'org.stianloader.sml6.SML6GradlePlugin'
        }
    }
}

task sourcesJar(type: Jar, dependsOn: classes) {
    archiveClassifier = 'sources'
    from sourceSets.main.allSource
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            groupId = project.group
            artifactId = base.archivesName.get()
            version = project.version

            from components['java']

            artifact sourcesJar
        }
    }
    repositories {
        if (System.getProperty('publishRepo') != null) {
            maven {
                url System.getProperty('publishRepo')
                allowInsecureProtocol = true
            }
        } else {
            mavenLocal()
        }
    }
}
